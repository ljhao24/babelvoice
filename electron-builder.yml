appId: com.ljhao.babelvoice
productName: BabelVoice
directories:
  output: dist
files:
  - out/**/*
  - protos/**/*
  # The tray icon falls back to this at runtime (tray.ts).
  - resources/icons/icon.png
  # better-sqlite3 loads only prebuilds/darwin-arm64.node; the rest is SQLite
  # source and other platforms' binaries.
  - "!node_modules/better-sqlite3/{deps,src,build}/**"
  - "!node_modules/better-sqlite3/prebuilds/{darwin-x64,linux-*,linuxmusl-*,win32-*}.node"
afterPack: packaging/macos/trim-electron-locales.mjs
afterAllArtifactBuild: packaging/macos/dmg-to-ulmo.mjs
extraResources:
  - from: protos
    to: protos
  - from: resources/babelvoice
    to: babelvoice
    filter:
      - "**/*"
  - from: resources/native
    to: native
    filter:
      - "**/*"
  # Opened by the 「查看图文教程」 buttons (platform/macos.ts openSetupGuide).
  - from: docs/SETUP-macOS.md
    to: docs/SETUP-macOS.md
  # Chinese permission prompts; the English ones are extendInfo below.
  - from: packaging/macos/zh_CN.lproj/InfoPlist.strings
    to: zh_CN.lproj/InfoPlist.strings
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  # The native audio bridge targets macOS 14 (binding.gyp).
  minimumSystemVersion: "14.0"
  # Chromium's own UI strings; the app ships only these two languages.
  # trim-electron-locales.mjs applies the list inside the framework too.
  electronLanguages: [en, zh_CN]
  target:
    - target: dmg
      arch: arm64
  # Signs with the keychain's "Developer ID Application" cert; without one,
  # electron-builder falls back to any other cert (e.g. "Apple Development"),
  # which only runs on this Mac. Notarizes when APPLE_KEYCHAIN_PROFILE (or
  # APPLE_ID / APPLE_API_KEY) is set, and Apple rejects any signature but
  # Developer ID. See docs/RELEASE-macOS.md.
  hardenedRuntime: true
  entitlements: packaging/macos/entitlements.mac.plist
  entitlementsInherit: packaging/macos/entitlements.mac.plist
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: BabelVoice uses the microphone to translate what you say for the others in the meeting.
    NSAudioCaptureUsageDescription: BabelVoice records your meeting app's audio to translate what the others say for you.
