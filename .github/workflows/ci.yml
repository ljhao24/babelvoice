name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The native audio bridge is Objective-C++ against macOS frameworks.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # node-gyp 9 (via electron-builder 25) imports distutils, which
      # Python 3.12 dropped; it builds better-sqlite3 and the native bridge.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
